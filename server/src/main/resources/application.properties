server.port=${PORT:8080}
server.address=${BIND_ADDRESS:127.0.0.1}
spring.application.name=aincrad-seed
spring.web.resources.static-locations=file:./client/dist/aincrad/browser/,classpath:/static/
server.error.include-message=never
spring.jackson.deserialization.fail-on-trailing-tokens=true
logging.level.root=WARN
logging.level.dev.aincrad=INFO
aincrad.world=${WORLD_FILE:./world/world.json}
aincrad.data=${DATA_DIR:./data}
aincrad.origins=${ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080,http://localhost:4200,http://127.0.0.1:4200}

aincrad.player-registration=${PLAYER_REGISTRATION_ENABLED:true}
aincrad.player-session-hours=${PLAYER_SESSION_HOURS:12}
aincrad.player-cookie-secure=${PLAYER_COOKIE_SECURE:false}

# Postfix is bundled with Compose; a local JAR uses the loopback-only mail utility.
aincrad.mail.enabled=${MAIL_ENABLED:false}
aincrad.mail.from=${MAIL_FROM:noreply@[${MAIL_PUBLIC_IP:127.0.0.1}]}
aincrad.public-url=${APP_PUBLIC_URL:http://localhost:8080}
aincrad.recovery-minutes=${PASSWORD_RESET_MINUTES:30}
spring.mail.host=${MAIL_HOST:127.0.0.1}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.debug=false
